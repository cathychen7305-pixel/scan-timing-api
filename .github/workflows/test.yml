name: Container tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 check_synthetic.py
      - run: docker compose run --build --rm tests
      - run: docker compose up --build -d api
      - run: curl --fail --retry 15 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health
      - if: always()
        run: docker compose down
